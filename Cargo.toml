[package]
name = "vkt-sw"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = "0.38.0"
winit = {version = "0.30.13", features = ["rwh_06"]}
tobj = "4.0.5"
glam = "0.33.11"

[profile.dev]
debug = "line-tables-only"
codegen-backend = "cranelift"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

